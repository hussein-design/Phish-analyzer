[pytest]
# Only collect tests from the tests/ directory.
# This prevents pytest from picking up security_test.py (needs a live backend),
# scratch *.txt files, and any other non-test Python files in the project root.
testpaths = tests
norecursedirs = .git .venv venv dist build migrations assets .kiro
python_files = test_*.py
python_classes = Test*
python_functions = test_*
